<text x="761" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="white">STAGE 1</text>
<text x="761" y="109" text-anchor="middle" font-size="14" font-weight="bold" fill="white">DBC → Parquet</text>
<text x="761" y="132" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">R / microdatasus</text>
<text x="761" y="155" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">DBC → CSV</text>
<text x="761" y="178" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">Polars (Parquet)</text>
<line x1="666" y1="195" x2="857" y2="195" stroke="#15803D" stroke-width="0.6" stroke-dasharray="3,2"/>
<text x="761" y="224" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">Harmonisation</text>
<text x="761" y="247" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">Date normalisation</text>
<line x1="873" y1="174" x2="903" y2="174" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="907" y="77" width="215" height="195" rx="5" fill="#FEFCE8" stroke="#854D0E" stroke-width="1.5"/>
<rect x="907" y="77" width="215" height="38" rx="4" fill="#854D0E" stroke="#854D0E" stroke-width="0"/>
<text x="1014" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="white">STAGE 2</text>
<text x="1014" y="109" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Climate Linkage</text>
<text x="1014" y="132" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">Spatial join:</text>
<text x="1014" y="155" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">centroid → BR-DWGD cell</text>
<text x="1014" y="178" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">(nearest neighbour)</text>
<text x="1014" y="201" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">Trimester assignment:</text>
<text x="1014" y="224" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">T1: wk 1–12  T2: wk 13–26</text>
<text x="1014" y="247" text-anchor="middle" font-size="13" font-weight="normal" fill="#334155">T3: wk 27 – birth</text>
<line x1="1126" y1="174" x2="1156" y2="174" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1160" y="77" width="215" height="195" rx="5" fill="#FDF4FF" stroke="#7E22CE" stroke-width="1.5"/>
<rect x="1160" y="77" width="215" height="38" rx="4" fill="#7E22CE" stroke="#7E22CE" stroke-width="0"/>
