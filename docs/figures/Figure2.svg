<text x="82" y="121" text-anchor="middle" font-size="13" font-weight="normal" fill="#64748B">Live births</text>
<text x="82" y="137" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748B">DBC files</text>
<rect x="163" y="79" width="145" height="72" rx="5" fill="#EFF6FF" stroke="#6B7280" stroke-width="1.5"/>
<text x="235" y="101" text-anchor="middle" font-size="18" font-weight="bold" fill="#6B7280">SIM</text>
