<text x="1050" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="white">PerinatalKG — ETL Pipeline and Knowledge Graph Construction</text>
<text x="312" y="71" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D4ED8">DATA SOURCES</text>
