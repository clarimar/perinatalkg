<text x="388" y="137" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748B">0.1° × 0.1°</text>
<rect x="469" y="79" width="145" height="72" rx="5" fill="#EFF6FF" stroke="#854D0E" stroke-width="1.5"/>
<text x="541" y="101" text-anchor="middle" font-size="18" font-weight="bold" fill="#854D0E">IBGE</text>
<text x="541" y="121" text-anchor="middle" font-size="13" font-weight="normal" fill="#64748B">Municipalities</text>
<text x="541" y="137" text-anchor="middle" font-size="12" font-weight="normal" fill="#64748B">centroids + HDI</text>
<line x1="619" y1="115" x2="649" y2="115" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="654" y="77" width="215" height="195" rx="5" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
